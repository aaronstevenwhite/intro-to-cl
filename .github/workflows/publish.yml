name: Build and deploy Quarto site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install Jupyter
        run: python -m pip install jupyter

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Install diagram dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends inkscape
          "$HOME/.TinyTeX/bin/x86_64-linux/tlmgr" update --self
          "$HOME/.TinyTeX/bin/x86_64-linux/tlmgr" install pgf standalone varwidth
          echo "$HOME/.TinyTeX/bin/x86_64-linux" >> "$GITHUB_PATH"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Render site
        run: quarto render --no-execute

      - name: Verify rendered site
        run: test -f docs/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
